<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CR Consulting — Gestión de Casos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0efe9;
      --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.2);
      --text: #1a1a18; --text-2: #5a5a56; --text-3: #8a8a84;
      --blue: #185FA5; --blue-bg: #E6F1FB;
      --green: #3B6D11; --green-bg: #EAF3DE;
      --red: #A32D2D; --red-bg: #FCEBEB;
      --amber: #854F0B; --amber-bg: #FAEEDA;
      --teal: #0F6E56; --teal-bg: #E1F5EE;
      --radius: 10px; --radius-sm: 6px;
    }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem 1rem; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
    .logo-icon { width: 34px; height: 34px; background: var(--blue-bg); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--blue); font-size: 17px; }
    .logo-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
    .logo-desc { font-size: 10px; color: var(--text-3); }
    .nav-label { font-size: 10px; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; padding: 0 8px; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-2); font-size: 13px; transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--blue-bg); color: var(--blue); font-weight: 500; }
    .nav-item i { font-size: 17px; }
    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); text-align: center; }

    .sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .sync-ok { background: #3B6D11; }
    .sync-loading { background: #854F0B; animation: blink 1s infinite; }
    .sync-error { background: #A32D2D; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .sync-bar { display: flex; align-items: center; font-size: 11px; color: var(--text-3); padding: 6px 8px; margin-bottom: 8px; border-radius: var(--radius-sm); background: var(--surface2); }

    .main { margin-left: 220px; flex: 1; padding: 2rem 2rem 4rem; max-width: 1200px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.75rem; gap: 1rem; }
    .page-title { font-size: 20px; font-weight: 600; }
    .page-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.15s; font-weight: 500; text-decoration: none; }
    .btn:hover { background: var(--surface2); }
    .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-primary:hover { opacity: 0.9; background: var(--blue); }

    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.75rem; }
    .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .metric-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
    .metric-value { font-size: 24px; font-weight: 600; }
    .metric-sub { font-size: 10px; color: var(--text-3); margin-top: 3px; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .search-box { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; }
    .search-box i { color: var(--text-3); font-size: 16px; }
    .search-box input { border: none; background: none; outline: none; font-family: inherit; font-size: 13px; color: var(--text); flex: 1; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.75rem; }
    .tab { padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    .case-list { display: flex; flex-direction: column; gap: 8px; }
    .case-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s; cursor: pointer; }
    .case-card:hover { border-color: var(--border-strong); }
    .case-card.open { border-color: var(--blue); }
    .case-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .case-info { flex: 1; min-width: 0; }
    .case-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .case-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .case-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .case-monto { font-size: 13px; font-weight: 600; }
    .badge { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .badge-pagado    { background: var(--green-bg); color: var(--green); }
    .badge-rechazado { background: var(--red-bg);   color: var(--red); }
    .badge-espera    { background: var(--blue-bg);  color: var(--blue); }
    .badge-pendiente { background: var(--amber-bg); color: var(--amber); }
    .chevron { font-size: 14px; color: var(--text-3); transition: transform 0.2s; }
    .case-card.open .chevron { transform: rotate(180deg); }
    .case-detail { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
    .case-card.open .case-detail { display: block; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; padding-top: 14px; margin-bottom: 12px; }
    .detail-label { font-size: 10px; color: var(--text-3); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
    .detail-value { font-size: 13px; font-weight: 500; color: var(--text); word-break: break-word; }
    .commission-row { display: flex; flex-wrap: wrap; gap: 8px; background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 12px; }
    .comm-item { min-width: 120px; }
    .comm-label { font-size: 10px; color: var(--text-3); margin-bottom: 3px; }
    .comm-value { font-size: 14px; font-weight: 600; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .view { display: none; }
    .view.active { display: block; }

    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: relative; overflow: hidden; }
    .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
    .kpi-blue::before  { background: var(--blue); }
    .kpi-green::before { background: var(--green); }
    .kpi-amber::before { background: var(--amber); }
    .kpi-red::before   { background: var(--red); }
    .kpi-teal::before  { background: var(--teal); }
    .kpi-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
    .kpi-value { font-size: 22px; font-weight: 600; }
    .kpi-sub { font-size: 10px; color: var(--text-3); margin-top: 4px; }
    .kpi-icon { position:absolute; right:14px; top:14px; font-size:22px; opacity:0.1; }

    .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 1.5rem; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .chart-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { font-size: 11px; color: var(--text-2); width: 120px; flex-shrink: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .bar-n { font-size: 11px; color: var(--text-3); width: 24px; text-align: right; }
    .bar-val { font-size: 10px; color: var(--text-3); width: 90px; text-align: right; flex-shrink: 0; }

    .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .data-table th { text-align: left; padding: 8px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); border-bottom: 1px solid var(--border); font-weight: 600; }
    .data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text-2); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--surface2); }

    .tables-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }

    .plazos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .plazo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
    .plazo-banco { font-size: 13px; font-weight: 600; }
    .plazo-comp { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .plazo-dias { font-size: 22px; font-weight: 600; margin-top: 8px; }
    .plazo-dias span { font-size: 11px; font-weight: 400; color: var(--text-3); }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); padding: 24px 28px; width: 90%; max-width: 580px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title-text { font-size: 16px; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea { font-family: inherit; font-size: 13px; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); }
    textarea { resize: vertical; min-height: 70px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a18; color: #fff; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; z-index: 999; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-3); }
    .empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }

    @media (max-width: 680px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1rem; }
      .detail-grid, .form-grid, .tables-row { grid-template-columns: 1fr; }
      .analytics-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="ti ti-shield-check"></i></div>
      <div><div class="logo-name">CR Consulting</div><div class="logo-desc">Seguros hipotecarios</div></div>
    </div>

    <div class="sync-bar">
      <span class="sync-dot sync-loading" id="sync-dot"></span>
      <span id="sync-text">Conectando…</span>
    </div>

    <div class="nav-label">Módulos</div>
    <button class="nav-item active" onclick="showSection('casos')"><i class="ti ti-folder-open"></i> Casos</button>
    <button class="nav-item" onclick="showSection('resumen')"><i class="ti ti-chart-bar"></i> Estadísticas</button>
    <button class="nav-item" onclick="showSection('plazos')"><i class="ti ti-clock"></i> Plazos bancarios</button>

    <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)">
      <div class="nav-label">Herramientas</div>
      <button class="nav-item" onclick="window.open('presupuestador.html','_blank')" style="background:var(--blue-bg);color:var(--blue)">
        <i class="ti ti-calculator"></i> Presupuestador
      </button>
    </div>

    <div class="sidebar-footer">
      CR Consulting &copy; 2025<br>
      <button onclick="loadFromSheets()" style="margin-top:6px;background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;font-family:inherit">
        <i class="ti ti-refresh"></i> Sincronizar
      </button>
    </div>
  </aside>

  <main class="main">

    <div id="sec-casos" class="view active">
      <div class="page-header">
        <div><div class="page-title">Gestión de casos</div><div class="page-sub" id="casos-count">Cargando…</div></div>
        <button class="btn btn-primary" onclick="openModal()"><i class="ti ti-plus"></i> Nuevo caso</button>
      </div>
      <div class="metrics" id="metrics"></div>
      <div class="tabs">
        <button class="tab active" onclick="setFilter('todos',this)">Todos</button>
        <button class="tab" onclick="setFilter('Pagado',this)">Pagados</button>
        <button class="tab" onclick="setFilter('Rechazado',this)">Rechazados</button>
        <button class="tab" onclick="setFilter('pendiente',this)">En gestión</button>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <i class="ti ti-search"></i>
          <input type="text" id="search" placeholder="Buscar por nombre, RUT, banco, ciudad…" oninput="renderCases()"/>
        </div>
      </div>
      <div class="case-list" id="case-list"></div>
    </div>

    <div id="sec-resumen" class="view">
      <div class="page-header">
        <div><div class="page-title">Estadísticas</div><div class="page-sub">Análisis completo de casos CR Consulting</div></div>
      </div>
      <div class="kpi-row" id="kpi-row"></div>
      <div class="analytics-grid" id="analytics-grid"></div>
      <div class="tables-row" id="tables-row"></div>
      <div class="chart-card" id="top5-table" style="margin-bottom:1.5rem"></div>
    </div>

    <div id="sec-plazos" class="view">
      <div class="page-header">
        <div><div class="page-title">Plazos bancarios</div><div class="page-sub">Días hábiles estimados por banco y aseguradora</div></div>
      </div>
      <div class="plazos-grid" id="plazos-grid"></div>
    </div>

  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-text" id="modal-title-text">Nuevo caso</div>
      <button class="btn" onclick="closeModal()" style="padding:4px 8px;border:none"><i class="ti ti-x" style="font-size:18px"></i></button>
    </div>
    <form onsubmit="saveCase(event)">
      <div class="form-grid">
        <div class="form-group full"><label>Nombre completo</label><input type="text" id="f-nombre" required placeholder="Nombre y apellidos"/></div>
        <div class="form-group"><label>RUT</label><input type="text" id="f-rut" placeholder="12.345.678-9"/></div>
        <div class="form-group"><label>Email</label><input type="email" id="f-email" placeholder="correo@ejemplo.com"/></div>
        <div class="form-group full"><label>Dirección</label><input type="text" id="f-dir" placeholder="Calle, número, ciudad"/></div>
        <div class="form-group">
          <label>Banco</label>
          <select id="f-banco">
            <option value="">Seleccionar…</option>
            <option>Banco Estado</option><option>BCI</option><option>Banco de Chile</option>
            <option>Banco Itaú</option><option>Scotiabank</option><option>Coopeuch</option>
            <option>Consorcio</option><option>MetLife</option><option>Caja los Andes</option>
            <option>Renta Nacional</option><option>Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo de siniestro</label>
          <select id="f-siniestro">
            <option value="">Seleccionar…</option>
            <option>Viento y Lluvia</option><option>Rotura de Cañerías</option>
            <option>Incendio</option><option>Inundación</option><option>Sismo</option><option>Otro</option>
          </select>
        </div>
        <div class="form-group"><label>Liquidador</label><input type="text" id="f-liquidador" placeholder="Nombre de la liquidadora"/></div>
        <div class="form-group">
          <label>Estado</label>
          <select id="f-estado">
            <option>Pendiente denuncio</option><option>Espera de informe final</option>
            <option>Pendiente antecedentes</option><option>Pendiente firma</option>
            <option>Pendiente PPTO</option><option>Pagado</option><option>Rechazado</option>
          </select>
        </div>
        <div class="form-group"><label>Responsable</label><input type="text" id="f-caso" placeholder="Caso Camilo / René…"/></div>
        <div class="form-group"><label>Correlativo / Folio</label><input type="text" id="f-correlativo" placeholder="FOLIO 00000"/></div>
        <div class="form-group"><label>Monto indemnizado ($)</label><input type="number" id="f-monto" placeholder="0"/></div>
        <div class="form-group">
          <label>% Comisión CR</label>
          <select id="f-porcentaje">
            <option value="0.25">25%</option><option value="0.20">20%</option>
            <option value="0.15">15%</option><option value="0.10">10%</option>
          </select>
        </div>
        <div class="form-group full"><label>Observaciones</label><textarea id="f-obs" placeholder="Notas adicionales…"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="save-btn"><i class="ti ti-check"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzopNjEalFZe6KKIne3zmZP2qY5emeMwltvoC2NXeNxTCmHUqg88IPyxHQN8TMfBrlB/exec';

const PLAZOS = [
  {banco:'MetLife',comp:'Consorcio',dias:30},{banco:'Coopeuch',comp:'Consorcio',dias:10},
  {banco:'BCI',comp:'HDI',dias:30},{banco:'Banco Estado',comp:'HDI',dias:90},
  {banco:'Scotiabank',comp:'HDI',dias:90},{banco:'Scotiabank',comp:'SURA',dias:60},
  {banco:'Chile / Edwards',comp:'BCI Corredores',dias:60},{banco:'MYV',comp:'BCI',dias:30},
  {banco:'Santander',comp:'Zurich',dias:15},{banco:'Itaú',comp:'SURA',dias:90},
  {banco:'Itaú',comp:'Everest',dias:90},{banco:'BICE',comp:'Consorcio',dias:30},
  {banco:'Itaú',comp:'FID',dias:90},
];

let cases = [], activeFilter = 'todos', expandedId = null, editingId = null;

const fmtCLP = n => n ? '$' + Math.round(n).toLocaleString('es-CL') : '—';
const initials = n => (n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const AVCOLORS = [
  {bg:'#E6F1FB',tc:'#185FA5'},{bg:'#E1F5EE',tc:'#0F6E56'},
  {bg:'#FAEEDA',tc:'#854F0B'},{bg:'#FBEAF0',tc:'#993556'},{bg:'#EAF3DE',tc:'#3B6D11'}
];

function badgeClass(e) {
  if(e==='Pagado') return 'badge-pagado';
  if(e==='Rechazado') return 'badge-rechazado';
  if((e||'').toLowerCase().includes('espera')) return 'badge-espera';
  return 'badge-pendiente';
}
function diasColor(d) { return d<=30?'var(--green)':d<=60?'var(--amber)':'var(--red)'; }

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=>t.className='toast', 2800);
}

function setSyncStatus(s, msg) {
  document.getElementById('sync-dot').className = 'sync-dot sync-' + s;
  document.getElementById('sync-text').textContent = msg;
}

// ── SHEETS ──────────────────────────────────────────────────────────────────
async function loadFromSheets() {
  setSyncStatus('loading','Sincronizando…');
  try {
    const res = await fetch(SHEETS_URL + '?t=' + Date.now());
    const json = await res.json();
    if(json.ok && Array.isArray(json.data)) {
      cases = json.data.map(r => ({
        ...r,
        id: String(r.id),
        monto:     r.monto     ? parseFloat(r.monto)     : null,
        porcentaje:r.porcentaje? parseFloat(r.porcentaje): 0.25,
        comision:  r.comision  ? parseFloat(r.comision)  : null,
        fondo:     r.fondo     ? parseFloat(r.fondo)     : null,
        retiro:    r.retiro    ? parseFloat(r.retiro)    : null,
      }));
      setSyncStatus('ok', `${cases.length} casos · sync ✓`);
      buildMetrics(); renderCases(); buildResumen();
    } else { setSyncStatus('error','Error al cargar'); }
  } catch(e) { setSyncStatus('error','Sin conexión'); }
}

async function apiCall(body) {
  const res = await fetch(SHEETS_URL, { method:'POST', body: JSON.stringify(body) });
  return res.json();
}

// ── MÉTRICAS ────────────────────────────────────────────────────────────────
function buildMetrics() {
  const p = cases.filter(c=>c.estado==='Pagado').length;
  const r = cases.filter(c=>c.estado==='Rechazado').length;
  const g = cases.filter(c=>c.estado!=='Pagado'&&c.estado!=='Rechazado').length;
  const tc= cases.reduce((a,c)=>a+(c.comision||0),0);
  document.getElementById('metrics').innerHTML = `
    <div class="metric-card"><div class="metric-label">Total casos</div><div class="metric-value">${cases.length}</div></div>
    <div class="metric-card"><div class="metric-label">Pagados</div><div class="metric-value" style="color:var(--green)">${p}</div></div>
    <div class="metric-card"><div class="metric-label">En gestión</div><div class="metric-value" style="color:var(--amber)">${g}</div></div>
    <div class="metric-card"><div class="metric-label">Rechazados</div><div class="metric-value" style="color:var(--red)">${r}</div></div>
    <div class="metric-card"><div class="metric-label">Comisión total CR</div><div class="metric-value" style="font-size:16px">${fmtCLP(tc)}</div><div class="metric-sub">en casos pagados</div></div>`;
}

// ── CASOS ────────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  renderCases();
}

function renderCases() {
  const q = (document.getElementById('search')?.value||'').toLowerCase();
  const filtered = cases.filter(c => {
    const mq = !q || [c.nombre,c.rut,c.banco,c.dir,c.caso,c.siniestro].some(v=>(v||'').toLowerCase().includes(q));
    if(!mq) return false;
    if(activeFilter==='todos') return true;
    if(activeFilter==='pendiente') return c.estado!=='Pagado'&&c.estado!=='Rechazado';
    return c.estado===activeFilter;
  });
  document.getElementById('casos-count').textContent = `${filtered.length} caso${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  const el = document.getElementById('case-list');
  if(!filtered.length){ el.innerHTML=`<div class="empty-state"><i class="ti ti-folder-off"></i><p>Sin casos que coincidan.</p></div>`; return; }
  el.innerHTML = filtered.map(c => {
    const ci = Math.abs(parseInt(String(c.id).slice(-2))||0) % 5;
    const av = AVCOLORS[ci];
    const isOpen = expandedId === String(c.id);
    return `
      <div class="case-card ${isOpen?'open':''}" id="card-${c.id}" onclick="toggleCard('${c.id}')">
        <div class="case-top">
          <div class="avatar" style="background:${av.bg};color:${av.tc}">${initials(c.nombre)}</div>
          <div class="case-info">
            <div class="case-name">${c.nombre}</div>
            <div class="case-meta">${c.banco||'—'} · ${c.siniestro||'—'} · ${c.dir||'—'}</div>
          </div>
          <div class="case-right">
            <span class="badge ${badgeClass(c.estado)}">${c.estado}</span>
            ${c.monto?`<span class="case-monto">${fmtCLP(c.monto)}</span>`:''}
            <i class="ti ti-chevron-down chevron"></i>
          </div>
        </div>
        <div class="case-detail">
          <div class="detail-grid">
            <div><div class="detail-label">RUT</div><div class="detail-value">${c.rut||'—'}</div></div>
            <div><div class="detail-label">Email</div><div class="detail-value">${c.email||'—'}</div></div>
            <div><div class="detail-label">Liquidador</div><div class="detail-value">${c.liquidador||'—'}</div></div>
            <div><div class="detail-label">Correlativo / Folio</div><div class="detail-value">${c.correlativo||'—'}</div></div>
            <div><div class="detail-label">Responsable</div><div class="detail-value">${c.caso||'—'}</div></div>
            <div><div class="detail-label">Boleta emitida</div><div class="detail-value">${c.boleta||'—'}</div></div>
            ${c.obs?`<div style="grid-column:1/-1"><div class="detail-label">Observaciones</div><div class="detail-value">${c.obs}</div></div>`:''}
          </div>
          ${c.monto?`
          <div class="commission-row">
            <div class="comm-item"><div class="comm-label">Monto indemnizado</div><div class="comm-value">${fmtCLP(c.monto)}</div></div>
            <div class="comm-item"><div class="comm-label">% CR</div><div class="comm-value">${Math.round((c.porcentaje||0)*100)}%</div></div>
            <div class="comm-item"><div class="comm-label">Comisión CR</div><div class="comm-value">${fmtCLP(c.comision)}</div></div>
            <div class="comm-item"><div class="comm-label">Fondo CR</div><div class="comm-value">${fmtCLP(c.fondo)}</div></div>
            <div class="comm-item"><div class="comm-label">Retiro c/u</div><div class="comm-value">${fmtCLP(c.retiro)}</div></div>
          </div>`:''}
          <div class="action-row" onclick="event.stopPropagation()">
            <button class="btn" onclick="editCase('${c.id}')"><i class="ti ti-edit"></i> Editar</button>
            <button class="btn" onclick="deleteCase('${c.id}')" style="color:var(--red)"><i class="ti ti-trash"></i> Eliminar</button>
            ${c.email?`<a href="mailto:${c.email}?subject=Actualización de su caso&body=Estimado/a ${(c.nombre||'').split(' ')[0]},%0A%0ALe informamos que su caso se encuentra actualmente en estado: ${c.estado}.%0A%0ASaludos,%0ACR Consulting" class="btn" style="text-decoration:none"><i class="ti ti-mail"></i> Enviar correo</a>`:''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleCard(id) {
  expandedId = expandedId===String(id)?null:String(id);
  renderCases();
}

async function deleteCase(id) {
  if(!confirm('¿Eliminar este caso? No se puede deshacer.')) return;
  setSyncStatus('loading','Eliminando…');
  try { await apiCall({action:'delete',id}); showToast('Caso eliminado'); await loadFromSheets(); }
  catch(e) { showToast('Error al eliminar','error'); setSyncStatus('error','Error'); }
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(prefill) {
  editingId = prefill ? String(prefill.id) : null;
  document.getElementById('modal-title-text').textContent = prefill ? 'Editar caso' : 'Nuevo caso';
  if(prefill) {
    ['nombre','rut','email','dir','banco','siniestro','liquidador','estado','caso','correlativo','monto','porcentaje','obs']
      .forEach(f => { const el=document.getElementById('f-'+f); if(el) el.value=prefill[f]||''; });
  } else {
    document.querySelectorAll('#modal-backdrop input,#modal-backdrop textarea').forEach(i=>i.value='');
    document.getElementById('f-estado').value='Pendiente denuncio';
    document.getElementById('f-porcentaje').value='0.25';
  }
  document.getElementById('modal-backdrop').classList.add('open');
}

function editCase(id) { const c=cases.find(x=>String(x.id)===String(id)); if(c) openModal(c); }
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); editingId=null; }
function closeModalOutside(e) { if(e.target===document.getElementById('modal-backdrop')) closeModal(); }

async function saveCase(e) {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='Guardando…';
  const monto    = parseFloat(document.getElementById('f-monto').value)||null;
  const pct      = parseFloat(document.getElementById('f-porcentaje').value)||0.25;
  const comision = monto ? monto*pct : null;
  const fondo    = comision ? comision*0.9 : null;
  const retiro   = fondo ? fondo*0.25 : null;
  const data = {
    nombre: document.getElementById('f-nombre').value,
    rut:    document.getElementById('f-rut').value,
    email:  document.getElementById('f-email').value,
    dir:    document.getElementById('f-dir').value,
    banco:  document.getElementById('f-banco').value,
    siniestro:  document.getElementById('f-siniestro').value,
    liquidador: document.getElementById('f-liquidador').value,
    estado:     document.getElementById('f-estado').value,
    caso:       document.getElementById('f-caso').value,
    correlativo:document.getElementById('f-correlativo').value,
    monto, porcentaje:pct, comision, fondo, retiro, boleta:'NO',
    obs: document.getElementById('f-obs').value,
  };
  try {
    if(editingId) { await apiCall({action:'update',id:editingId,...data}); showToast('Caso actualizado ✓'); }
    else          { await apiCall({action:'add',...data}); showToast('Caso agregado ✓'); }
    closeModal(); await loadFromSheets();
  } catch(err) { showToast('Error al guardar','error'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="ti ti-check"></i> Guardar'; }
}

// ── ESTADÍSTICAS ─────────────────────────────────────────────────────────────
function buildResumen() {
  const pagados    = cases.filter(c=>c.estado==='Pagado');
  const rechazados = cases.filter(c=>c.estado==='Rechazado');
  const gestion    = cases.filter(c=>c.estado!=='Pagado'&&c.estado!=='Rechazado');
  const totalMonto = pagados.reduce((a,c)=>a+(c.monto||0),0);
  const totalCom   = pagados.reduce((a,c)=>a+(c.comision||0),0);
  const totalFondo = pagados.reduce((a,c)=>a+(c.fondo||0),0);
  const avgMonto   = pagados.length ? totalMonto/pagados.length : 0;
  const tasaExito  = cases.length ? Math.round(pagados.length/cases.length*100) : 0;

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card kpi-blue"><i class="ti ti-folders kpi-icon"></i><div class="kpi-label">Total casos</div><div class="kpi-value">${cases.length}</div><div class="kpi-sub">${pagados.length} pagados · ${gestion.length} en gestión</div></div>
    <div class="kpi-card kpi-green"><i class="ti ti-coin kpi-icon"></i><div class="kpi-label">Monto total gestionado</div><div class="kpi-value" style="font-size:17px">${fmtCLP(totalMonto)}</div><div class="kpi-sub">${pagados.length} casos pagados</div></div>
    <div class="kpi-card kpi-teal"><i class="ti ti-receipt kpi-icon"></i><div class="kpi-label">Comisión total CR</div><div class="kpi-value" style="font-size:17px">${fmtCLP(totalCom)}</div><div class="kpi-sub">Fondo: ${fmtCLP(totalFondo)}</div></div>
    <div class="kpi-card kpi-amber"><i class="ti ti-chart-line kpi-icon"></i><div class="kpi-label">Promedio por caso</div><div class="kpi-value" style="font-size:17px">${fmtCLP(avgMonto)}</div><div class="kpi-sub">en casos pagados</div></div>
    <div class="kpi-card kpi-${tasaExito>=60?'green':'amber'}"><i class="ti ti-target kpi-icon"></i><div class="kpi-label">Tasa de éxito</div><div class="kpi-value">${tasaExito}%</div><div class="kpi-sub">${rechazados.length} rechazados</div></div>`;

  const count = arr => arr.reduce((a,c)=>{a[c]=(a[c]||0)+1;return a;},{});
  const sinTypes     = count(cases.map(c=>c.siniestro||'Otro'));
  const bancos       = count(cases.map(c=>c.banco||'Otro'));
  const estados      = count(cases.map(c=>c.estado||'—'));
  const responsables = count(cases.map(c=>c.caso||'Sin asignar'));
  const liquidadores = count(pagados.map(c=>c.liquidador||'—'));

  const ciudades = count(cases.map(c=>{
    const d=(c.dir||'').toLowerCase();
    if(d.includes('hualpen')||d.includes('hualpén')) return 'Hualpén';
    if(d.includes('chiguayante')) return 'Chiguayante';
    if(d.includes('san pedro')) return 'San Pedro de la Paz';
    if(d.includes('talcahuano')) return 'Talcahuano';
    if(d.includes('concep')) return 'Concepción';
    return 'Otra';
  }));

  const bar = (data, colors) => {
    const max = Math.max(...Object.values(data),1);
    return Object.entries(data).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`
      <div class="bar-row">
        <div class="bar-label">${k}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%;background:${Array.isArray(colors)?colors[i%colors.length]:colors}"></div></div>
        <div class="bar-n">${v}</div>
      </div>`).join('');
  };

  const C1 = ['#378ADD','#1D9E75','#D85A30','#7F77DD','#D4537E','#999'];
  const C2 = ['#185FA5','#1D9E75','#D85A30','#854F0B','#993556','#0F6E56'];
  const CEST = {'Pagado':'#3B6D11','Rechazado':'#A32D2D','Espera de informe final':'#185FA5','Pendiente denuncio':'#854F0B','Pendiente antecedentes':'#854F0B','Pendiente firma':'#854F0B','Pendiente PPTO':'#854F0B'};

  document.getElementById('analytics-grid').innerHTML = `
    <div class="chart-card"><div class="chart-title">Tipo de siniestro</div>${bar(sinTypes,C1)}</div>
    <div class="chart-card"><div class="chart-title">Estado de casos</div>${
      Object.entries(estados).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
        const max=Math.max(...Object.values(estados),1);
        return `<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%;background:${CEST[k]||'#888'}"></div></div><div class="bar-n">${v}</div></div>`;
      }).join('')}
    </div>
    <div class="chart-card"><div class="chart-title">Casos por banco</div>${bar(bancos,C2)}</div>
    <div class="chart-card"><div class="chart-title">Distribución por ciudad</div>${bar(ciudades,C2)}</div>
    <div class="chart-card"><div class="chart-title">Casos por responsable</div>${bar(responsables,C2)}</div>
    <div class="chart-card"><div class="chart-title">Liquidadores (casos pagados)</div>${bar(liquidadores,C2)}</div>`;

  // Monto por banco
  const montoBanco = {};
  pagados.forEach(c=>{montoBanco[c.banco||'Otro']=(montoBanco[c.banco||'Otro']||0)+(c.monto||0);});
  const maxMB = Math.max(...Object.values(montoBanco),1);
  const montoBancoBar = Object.entries(montoBanco).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`
    <div class="bar-row">
      <div class="bar-label">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxMB*100)}%;background:${C2[i%C2.length]}"></div></div>
      <div class="bar-val">${fmtCLP(v)}</div>
    </div>`).join('');

  // Comisión pendiente en gestión
  const gestConMonto = gestion.filter(c=>c.comision);
  const maxGC = Math.max(...gestConMonto.map(c=>c.comision||0),1);
  const gestBar = gestConMonto.length
    ? gestConMonto.sort((a,b)=>(b.comision||0)-(a.comision||0)).slice(0,6).map(c=>`
        <div class="bar-row">
          <div class="bar-label">${(c.nombre||'').split(' ').slice(0,2).join(' ')}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round((c.comision||0)/maxGC*100)}%;background:var(--amber)"></div></div>
          <div class="bar-val">${fmtCLP(c.comision)}</div>
        </div>`).join('')
    : '<p style="font-size:12px;color:var(--text-3)">Sin casos en gestión con monto estimado.</p>';

  document.getElementById('tables-row').innerHTML = `
    <div class="chart-card"><div class="chart-title">Monto gestionado por banco</div>${montoBancoBar}</div>
    <div class="chart-card"><div class="chart-title">Comisión potencial en gestión</div>${gestBar}</div>`;

  const top5 = [...pagados].sort((a,b)=>(b.monto||0)-(a.monto||0)).slice(0,5);
  document.getElementById('top5-table').innerHTML = `
    <div class="chart-title">Top 5 casos por monto indemnizado</div>
    <table class="data-table">
      <thead><tr><th>Asegurado</th><th>Banco</th><th>Siniestro</th><th>Monto</th><th>Comisión CR</th></tr></thead>
      <tbody>${top5.map(c=>`<tr>
        <td style="font-weight:600;color:var(--text)">${c.nombre}</td>
        <td>${c.banco||'—'}</td><td>${c.siniestro||'—'}</td>
        <td style="color:var(--green);font-weight:600">${fmtCLP(c.monto)}</td>
        <td style="color:var(--blue);font-weight:600">${fmtCLP(c.comision)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
}

// ── PLAZOS ───────────────────────────────────────────────────────────────────
function buildPlazos() {
  document.getElementById('plazos-grid').innerHTML = PLAZOS.map(p=>`
    <div class="plazo-card">
      <div class="plazo-banco">${p.banco}</div>
      <div class="plazo-comp">${p.comp}</div>
      <div class="plazo-dias" style="color:${diasColor(p.dias)}">${p.dias} <span>días hábiles</span></div>
    </div>`).join('');
}

// ── NAVEGACIÓN ───────────────────────────────────────────────────────────────
function showSection(sec) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('sec-'+sec).classList.add('active');
  const idx = ['casos','resumen','plazos'].indexOf(sec);
  document.querySelectorAll('.nav-item')[idx]?.classList.add('active');
  if(sec==='resumen') buildResumen();
}

buildPlazos();
loadFromSheets();
</script>
</body>
