<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CR Consulting — Gestión de Casos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.2);
      --text: #1a1a18;
      --text-2: #5a5a56;
      --text-3: #8a8a84;
      --blue: #185FA5;
      --blue-bg: #E6F1FB;
      --green: #3B6D11;
      --green-bg: #EAF3DE;
      --red: #A32D2D;
      --red-bg: #FCEBEB;
      --amber: #854F0B;
      --amber-bg: #FAEEDA;
      --teal: #0F6E56;
      --teal-bg: #E1F5EE;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* SIDEBAR */
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1rem;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: var(--blue-bg);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--blue);
      font-size: 17px;
    }

    .logo-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
    .logo-desc { font-size: 10px; color: var(--text-3); }

    .nav-label { font-size: 10px; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; padding: 0 8px; }

    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-2);
      font-size: 13px;
      transition: all 0.15s;
      margin-bottom: 2px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--blue-bg); color: var(--blue); font-weight: 500; }
    .nav-item i { font-size: 17px; }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-3);
      text-align: center;
    }

    /* MAIN */
    .main {
      margin-left: 220px;
      flex: 1;
      padding: 2rem 2rem 4rem;
      max-width: 1100px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      gap: 1rem;
    }

    .page-title { font-size: 20px; font-weight: 600; }
    .page-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .btn:hover { background: var(--surface2); }
    .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-primary:hover { background: #185FA5dd; }

    /* METRICS */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 1.75rem;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .metric-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
    .metric-value { font-size: 24px; font-weight: 600; }
    .metric-sub { font-size: 10px; color: var(--text-3); margin-top: 3px; }

    /* FILTERS / SEARCH */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
    }

    .search-box i { color: var(--text-3); font-size: 16px; }

    .search-box input {
      border: none; background: none; outline: none;
      font-family: inherit; font-size: 13px;
      color: var(--text); flex: 1;
    }

    .filter-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      font-weight: 500;
    }

    .filter-pill:hover { background: var(--surface2); }
    .filter-pill.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* CASE CARDS */
    .case-list { display: flex; flex-direction: column; gap: 8px; }

    .case-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
      cursor: pointer;
    }

    .case-card:hover { border-color: var(--border-strong); }
    .case-card.open { border-color: #185FA5; }

    .case-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
    }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }

    .case-info { flex: 1; min-width: 0; }
    .case-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .case-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    .case-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .case-monto { font-size: 13px; font-weight: 600; }

    .badge {
      font-size: 10px; font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge-pagado    { background: var(--green-bg); color: var(--green); }
    .badge-rechazado { background: var(--red-bg);   color: var(--red); }
    .badge-espera    { background: var(--blue-bg);  color: var(--blue); }
    .badge-pendiente { background: var(--amber-bg); color: var(--amber); }

    .chevron { font-size: 14px; color: var(--text-3); transition: transform 0.2s; }
    .case-card.open .chevron { transform: rotate(180deg); }

    /* CASE DETAIL */
    .case-detail {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
      margin-top: 0;
    }

    .case-card.open .case-detail { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
      padding-top: 14px;
      margin-bottom: 12px;
    }

    .detail-label { font-size: 10px; color: var(--text-3); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
    .detail-value { font-size: 13px; font-weight: 500; color: var(--text); word-break: break-word; }

    .commission-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .comm-item { min-width: 120px; }
    .comm-label { font-size: 10px; color: var(--text-3); margin-bottom: 3px; }
    .comm-value { font-size: 14px; font-weight: 600; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; }

    /* TABS */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.75rem; gap: 0; }

    .tab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-3);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
      background: none;
      border-top: none; border-left: none; border-right: none;
      font-family: inherit;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* VIEW SWITCHING */
    .view { display: none; }
    .view.active { display: block; }

    /* RESUMEN */
    .resumen-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 1.5rem;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    .chart-title { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { font-size: 11px; color: var(--text-2); width: 110px; flex-shrink: 0; text-align: right; }
    .bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .bar-n { font-size: 11px; color: var(--text-3); width: 20px; }

    /* PLAZOS */
    .plazos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .plazo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
    }

    .plazo-banco { font-size: 13px; font-weight: 600; }
    .plazo-comp { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .plazo-dias { font-size: 22px; font-weight: 600; margin-top: 8px; }
    .plazo-dias span { font-size: 11px; font-weight: 400; color: var(--text-3); }

    /* MODAL */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 28px;
      width: 90%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 16px; font-weight: 600; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.04em; }

    input, select, textarea {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--blue); }
    textarea { resize: vertical; min-height: 70px; }

    .modal-footer {
      display: flex; justify-content: flex-end; gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-3);
    }

    .empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }
    .empty-state p { font-size: 13px; }

    /* RESPONSIVE */
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1rem; }
      .resumen-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="ti ti-shield-check"></i></div>
      <div>
        <div class="logo-name">CR Consulting</div>
        <div class="logo-desc">Seguros hipotecarios</div>
      </div>
    </div>

    <div class="nav-label">Módulos</div>
    <button class="nav-item active" onclick="showSection('casos')">
      <i class="ti ti-folder-open"></i> Casos
    </button>
    <button class="nav-item" onclick="showSection('resumen')">
      <i class="ti ti-chart-bar"></i> Resumen
    </button>
    <button class="nav-item" onclick="showSection('plazos')">
      <i class="ti ti-clock"></i> Plazos bancarios
    </button>

    <div class="sidebar-footer">
      CR Consulting &copy; 2025<br>v1.0
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- CASOS -->
    <div id="sec-casos" class="view active">
      <div class="page-header">
        <div>
          <div class="page-title">Gestión de casos</div>
          <div class="page-sub" id="casos-count"></div>
        </div>
        <button class="btn btn-primary" onclick="openModal()">
          <i class="ti ti-plus"></i> Nuevo caso
        </button>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="tabs">
        <button class="tab active" onclick="setFilter('todos', this)">Todos</button>
        <button class="tab" onclick="setFilter('Pagado', this)">Pagados</button>
        <button class="tab" onclick="setFilter('Rechazado', this)">Rechazados</button>
        <button class="tab" onclick="setFilter('pendiente', this)">En gestión</button>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <i class="ti ti-search"></i>
          <input type="text" id="search" placeholder="Buscar por nombre, RUT, banco…" oninput="renderCases()" />
        </div>
      </div>

      <div class="case-list" id="case-list"></div>
    </div>

    <!-- RESUMEN -->
    <div id="sec-resumen" class="view">
      <div class="page-header">
        <div>
          <div class="page-title">Resumen financiero</div>
          <div class="page-sub">Totales y distribución de casos</div>
        </div>
      </div>
      <div class="metrics" id="metrics-resumen"></div>
      <div class="resumen-grid" id="resumen-charts"></div>
    </div>

    <!-- PLAZOS -->
    <div id="sec-plazos" class="view">
      <div class="page-header">
        <div>
          <div class="page-title">Plazos bancarios</div>
          <div class="page-sub">Días hábiles estimados por banco y compañía aseguradora</div>
        </div>
      </div>
      <div class="plazos-grid" id="plazos-grid"></div>
    </div>

  </main>
</div>

<!-- MODAL NUEVO CASO -->
<div class="modal-backdrop" id="modal-backdrop" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo caso</div>
      <button class="btn" onclick="closeModal()" style="padding:4px 8px; border:none"><i class="ti ti-x" style="font-size:18px"></i></button>
    </div>
    <form onsubmit="saveCase(event)">
      <div class="form-grid">
        <div class="form-group full">
          <label>Nombre completo asegurado</label>
          <input type="text" id="f-nombre" required placeholder="Nombre y apellidos" />
        </div>
        <div class="form-group">
          <label>RUT</label>
          <input type="text" id="f-rut" placeholder="12.345.678-9" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="form-group full">
          <label>Dirección</label>
          <input type="text" id="f-dir" placeholder="Calle, número, ciudad" />
        </div>
        <div class="form-group">
          <label>Banco</label>
          <select id="f-banco">
            <option value="">Seleccionar…</option>
            <option>Banco Estado</option>
            <option>BCI</option>
            <option>Banco de Chile</option>
            <option>Banco Itaú</option>
            <option>Scotiabank</option>
            <option>Coopeuch</option>
            <option>Consorcio</option>
            <option>MetLife</option>
            <option>Caja los Andes</option>
            <option>Renta Nacional</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo de siniestro</label>
          <select id="f-siniestro">
            <option value="">Seleccionar…</option>
            <option>Viento y Lluvia</option>
            <option>Rotura de Cañerías</option>
            <option>Incendio</option>
            <option>Inundación</option>
            <option>Sismo</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Liquidador</label>
          <input type="text" id="f-liquidador" placeholder="Nombre de la liquidadora" />
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="f-estado">
            <option>Pendiente denuncio</option>
            <option>Espera de informe final</option>
            <option>Pendiente antecedentes</option>
            <option>Pendiente firma</option>
            <option>Pendiente PPTO</option>
            <option>Pagado</option>
            <option>Rechazado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Caso (responsable)</label>
          <input type="text" id="f-caso" placeholder="Caso Camilo / René…" />
        </div>
        <div class="form-group">
          <label>N° Correlativo / Folio</label>
          <input type="text" id="f-correlativo" placeholder="FOLIO 00000" />
        </div>
        <div class="form-group">
          <label>Monto indemnizado ($)</label>
          <input type="number" id="f-monto" placeholder="0" />
        </div>
        <div class="form-group">
          <label>% Comisión CR</label>
          <select id="f-porcentaje">
            <option value="0.25">25%</option>
            <option value="0.20">20%</option>
            <option value="0.15">15%</option>
            <option value="0.10">10%</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Observaciones</label>
          <textarea id="f-obs" placeholder="Notas adicionales del caso…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Guardar caso</button>
      </div>
    </form>
  </div>
</div>

let cases = JSON.parse(localStorage.getItem('cr_cases') || 'null') || SEED_CASES;

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmtCLP = n => n ? '$' + Math.round(n).toLocaleString('es-CL') : '—';
const initials = name => name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const AVCOLORS = [
  {bg:'#E6F1FB',tc:'#185FA5'},{bg:'#E1F5EE',tc:'#0F6E56'},
  {bg:'#FAEEDA',tc:'#854F0B'},{bg:'#FBEAF0',tc:'#993556'},
  {bg:'#EAF3DE',tc:'#3B6D11'}
];

function badgeClass(e) {
  if (e === 'Pagado') return 'badge-pagado';
  if (e === 'Rechazado') return 'badge-rechazado';
  if (e.toLowerCase().includes('espera')) return 'badge-espera';
  return 'badge-pendiente';
}

function diasColor(d) {
  if (d <= 30) return 'var(--green)';
  if (d <= 60) return 'var(--amber)';
  return 'var(--red)';
}

// ─── MÉTRICAS ─────────────────────────────────────────────────────────────────
function buildMetrics() {
  const pagados   = cases.filter(c => c.estado === 'Pagado').length;
  const rechazados= cases.filter(c => c.estado === 'Rechazado').length;
  const gestion   = cases.filter(c => c.estado !== 'Pagado' && c.estado !== 'Rechazado').length;
  const totalCom  = cases.reduce((a,c) => a + (c.comision||0), 0);

  document.getElementById('metrics').innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Total casos</div>
      <div class="metric-value">${cases.length}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Pagados</div>
      <div class="metric-value" style="color:var(--green)">${pagados}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">En gestión</div>
      <div class="metric-value" style="color:var(--amber)">${gestion}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Rechazados</div>
      <div class="metric-value" style="color:var(--red)">${rechazados}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Comisión total CR</div>
      <div class="metric-value" style="font-size:16px">${fmtCLP(totalCom)}</div>
      <div class="metric-sub">en casos pagados</div>
    </div>
  `;
}

// ─── CASOS ─────────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  renderCases();
}

function renderCases() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  const filtered = cases.filter(c => {
    const matchQ = !q || c.nombre.toLowerCase().includes(q) || c.rut.includes(q)
      || (c.banco||'').toLowerCase().includes(q) || (c.dir||'').toLowerCase().includes(q)
      || (c.caso||'').toLowerCase().includes(q);
    if (!matchQ) return false;
    if (activeFilter === 'todos') return true;
    if (activeFilter === 'pendiente') return c.estado !== 'Pagado' && c.estado !== 'Rechazado';
    return c.estado === activeFilter;
  });

  document.getElementById('casos-count').textContent = `${filtered.length} caso${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  const el = document.getElementById('case-list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-folder-off"></i><p>Sin casos que coincidan con el filtro.</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(c => {
    const ci = (c.id - 1) % 5;
    const av = AVCOLORS[ci];
    const isOpen = expandedId === c.id;
    return `
      <div class="case-card ${isOpen ? 'open' : ''}" id="card-${c.id}" onclick="toggleCard(${c.id})">
        <div class="case-top">
          <div class="avatar" style="background:${av.bg};color:${av.tc}">${initials(c.nombre)}</div>
          <div class="case-info">
            <div class="case-name">${c.nombre}</div>
            <div class="case-meta">${c.banco} &nbsp;·&nbsp; ${c.siniestro} &nbsp;·&nbsp; ${c.dir}</div>
          </div>
          <div class="case-right">
            <span class="badge ${badgeClass(c.estado)}">${c.estado}</span>
            ${c.monto ? `<span class="case-monto">${fmtCLP(c.monto)}</span>` : ''}
            <i class="ti ti-chevron-down chevron"></i>
          </div>
        </div>
        <div class="case-detail">
          <div class="detail-grid">
            <div><div class="detail-label">RUT</div><div class="detail-value">${c.rut||'—'}</div></div>
            <div><div class="detail-label">Email</div><div class="detail-value">${c.email||'—'}</div></div>
            <div><div class="detail-label">Liquidador</div><div class="detail-value">${c.liquidador||'—'}</div></div>
            <div><div class="detail-label">Correlativo / Folio</div><div class="detail-value">${c.correlativo||'—'}</div></div>
            <div><div class="detail-label">Responsable</div><div class="detail-value">${c.caso||'—'}</div></div>
            <div><div class="detail-label">Boleta emitida</div><div class="detail-value">${c.boleta||'—'}</div></div>
            ${c.obs ? `<div style="grid-column:1/-1"><div class="detail-label">Observaciones</div><div class="detail-value">${c.obs}</div></div>` : ''}
          </div>
          ${c.monto ? `
          <div class="commission-row">
            <div class="comm-item"><div class="comm-label">Monto indemnizado</div><div class="comm-value">${fmtCLP(c.monto)}</div></div>
            <div class="comm-item"><div class="comm-label">% CR</div><div class="comm-value">${Math.round(c.porcentaje*100)}%</div></div>
            <div class="comm-item"><div class="comm-label">Comisión CR</div><div class="comm-value">${fmtCLP(c.comision)}</div></div>
            <div class="comm-item"><div class="comm-label">Fondo CR</div><div class="comm-value">${fmtCLP(c.fondo)}</div></div>
            <div class="comm-item"><div class="comm-label">Retiro c/u</div><div class="comm-value">${fmtCLP(c.retiro)}</div></div>
          </div>` : ''}
          <div class="action-row" onclick="event.stopPropagation()">
            <button class="btn" onclick="editCase(${c.id})"><i class="ti ti-edit"></i> Editar</button>
            <button class="btn" onclick="deleteCase(${c.id})" style="color:var(--red)"><i class="ti ti-trash"></i> Eliminar</button>
            ${c.email ? `<a href="mailto:${c.email}?subject=Actualización caso ${c.nombre}&body=Estimado/a ${c.nombre.split(' ')[0]},%0A%0ALe informamos que su caso se encuentra actualmente en estado: ${c.estado}.%0A%0ASaludos,%0ACR Consulting" class="btn" style="text-decoration:none"><i class="ti ti-mail"></i> Enviar correo</a>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleCard(id) {
  expandedId = expandedId === id ? null : id;
  renderCases();
  if (expandedId) {
    setTimeout(() => {
      document.getElementById('card-' + expandedId)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function deleteCase(id) {
  if (!confirm('¿Eliminar este caso? Esta acción no se puede deshacer.')) return;
  cases = cases.filter(c => c.id !== id);
  if (expandedId === id) expandedId = null;
  save();
  buildMetrics();
  renderCases();
  buildResumen();
}

// ─── MODAL / FORMULARIO ────────────────────────────────────────────────────────
let editingId = null;

function openModal(prefill) {
  editingId = prefill ? prefill.id : null;
  const m = document.getElementById('modal-backdrop');
  if (prefill) {
    document.getElementById('f-nombre').value = prefill.nombre || '';
    document.getElementById('f-rut').value = prefill.rut || '';
    document.getElementById('f-email').value = prefill.email || '';
    document.getElementById('f-dir').value = prefill.dir || '';
    document.getElementById('f-banco').value = prefill.banco || '';
    document.getElementById('f-siniestro').value = prefill.siniestro || '';
    document.getElementById('f-liquidador').value = prefill.liquidador || '';
    document.getElementById('f-estado').value = prefill.estado || 'Pendiente denuncio';
    document.getElementById('f-caso').value = prefill.caso || '';
    document.getElementById('f-correlativo').value = prefill.correlativo || '';
    document.getElementById('f-monto').value = prefill.monto || '';
    document.getElementById('f-porcentaje').value = prefill.porcentaje || 0.25;
    document.getElementById('f-obs').value = prefill.obs || '';
  } else {
    document.querySelectorAll('#modal-backdrop input, #modal-backdrop textarea').forEach(i => i.value = '');
    document.getElementById('f-estado').value = 'Pendiente denuncio';
    document.getElementById('f-porcentaje').value = 0.25;
  }
  m.classList.add('open');
}

function editCase(id) {
  const c = cases.find(x => x.id === id);
  if (c) openModal(c);
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  editingId = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
}

function saveCase(e) {
  e.preventDefault();
  const monto = parseFloat(document.getElementById('f-monto').value) || null;
  const pct = parseFloat(document.getElementById('f-porcentaje').value);
  const comision = monto ? monto * pct : null;
  const fondo = comision ? comision * 0.9 : null;
  const retiro = fondo ? fondo * 0.25 : null;

  const data = {
    nombre: document.getElementById('f-nombre').value,
    rut: document.getElementById('f-rut').value,
    email: document.getElementById('f-email').value,
    dir: document.getElementById('f-dir').value,
    banco: document.getElementById('f-banco').value,
    siniestro: document.getElementById('f-siniestro').value,
    liquidador: document.getElementById('f-liquidador').value,
    estado: document.getElementById('f-estado').value,
    caso: document.getElementById('f-caso').value,
    correlativo: document.getElementById('f-correlativo').value,
    monto, porcentaje: pct, comision, fondo, retiro,
    boleta: 'NO',
    obs: document.getElementById('f-obs').value,
  };

  if (editingId) {
    const idx = cases.findIndex(c => c.id === editingId);
    cases[idx] = { ...cases[idx], ...data };
  } else {
    cases.push({ id: nextId++, ...data });
  }

  save();
  closeModal();
  buildMetrics();
  renderCases();
  buildResumen();
}

// ─── RESUMEN ───────────────────────────────────────────────────────────────────
function buildResumen() {
  const totalMonto = cases.reduce((a,c) => a+(c.monto||0), 0);
  const totalCom   = cases.reduce((a,c) => a+(c.comision||0), 0);
  const totalFondo = cases.reduce((a,c) => a+(c.fondo||0), 0);

  document.getElementById('metrics-resumen').innerHTML = `
    <div class="metric-card"><div class="metric-label">Monto total gestionado</div><div class="metric-value" style="font-size:18px">${fmtCLP(totalMonto)}</div></div>
    <div class="metric-card"><div class="metric-label">Comisión total CR</div><div class="metric-value" style="font-size:18px">${fmtCLP(totalCom)}</div></div>
    <div class="metric-card"><div class="metric-label">Fondo CR acumulado</div><div class="metric-value" style="font-size:18px">${fmtCLP(totalFondo)}</div></div>
  `;

  const sinTypes = {};
  cases.forEach(c => { sinTypes[c.siniestro] = (sinTypes[c.siniestro]||0)+1; });
  const sinColors = { 'Viento y Lluvia':'#378ADD', 'Rotura de Cañerías':'#1D9E75', 'Incendio':'#D85A30', 'Inundación':'#7F77DD', 'Sismo':'#D4537E' };
  const maxS = Math.max(...Object.values(sinTypes), 1);

  const estGroups = { 'Pagado': cases.filter(c=>c.estado==='Pagado').length, 'Rechazado': cases.filter(c=>c.estado==='Rechazado').length, 'En gestión': cases.filter(c=>c.estado!=='Pagado'&&c.estado!=='Rechazado').length };
  const estColors = { 'Pagado':'#639922', 'Rechazado':'#E24B4A', 'En gestión':'#BA7517' };
  const maxE = Math.max(...Object.values(estGroups), 1);

  document.getElementById('resumen-charts').innerHTML = `
    <div class="chart-card">
      <div class="chart-title">Tipo de siniestro</div>
      ${Object.entries(sinTypes).map(([k,v]) => `
        <div class="bar-row">
          <div class="bar-label">${k}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxS*100)}%;background:${sinColors[k]||'#888'}"></div></div>
          <div class="bar-n">${v}</div>
        </div>
      `).join('')}
    </div>
    <div class="chart-card">
      <div class="chart-title">Estado de casos</div>
      ${Object.entries(estGroups).map(([k,v]) => `
        <div class="bar-row">
          <div class="bar-label">${k}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxE*100)}%;background:${estColors[k]}"></div></div>
          <div class="bar-n">${v}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ─── PLAZOS ────────────────────────────────────────────────────────────────────
function buildPlazos() {
  document.getElementById('plazos-grid').innerHTML = PLAZOS.map(p => `
    <div class="plazo-card">
      <div class="plazo-banco">${p.banco}</div>
      <div class="plazo-comp">${p.comp}</div>
      <div class="plazo-dias" style="color:${diasColor(p.dias)}">${p.dias} <span>días hábiles</span></div>
    </div>
  `).join('');
}

// ─── NAVEGACIÓN ────────────────────────────────────────────────────────────────
function showSection(sec) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('sec-' + sec).classList.add('active');
  const idx = ['casos','resumen','plazos'].indexOf(sec);
  document.querySelectorAll('.nav-item')[idx]?.classList.add('active');
}

// ─── INIT ──────────────────────────────────────────────────────────────────────
buildMetrics();
renderCases();
buildResumen();
buildPlazos();
</script>
</body>
</html>
